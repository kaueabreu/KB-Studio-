<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KB Studio - controle financeiro</title>
<meta name="description" content="Controle financeiro do KB Studio" />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F3F0E8" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="KB Studio" />
<link rel="icon" href="favicon-32.png" sizes="32x32" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo"><img src="logo-mark.png" alt="KB Studio" /></div>
    <h1>KB Studio</h1>
    <p class="sub">Controle financeiro</p>
    <form id="loginForm">
      <div class="form-field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" required autocomplete="username" />
      </div>
      <div class="form-field">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" />
      </div>
      <p class="auth-error" id="authError"></p>
      <button type="submit" class="primary" style="width:100%; padding:11px;">Entrar</button>
    </form>
  </div>
</div>

<div id="appScreen" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="app.js"></script>
</body>
</html>
